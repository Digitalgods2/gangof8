<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conclave OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1218; --panel:#171c26; --line:#2a3242; --text:#d7dce5; --dim:#8b94a7;
          --accent:#5b9dd9; --ok:#4caf7d; --warn:#e0a93e; --bad:#d96b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:14px 22px;
           border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .sub { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 430px 1fr; gap:0; height:calc(100vh - 53px); }
  #left { border-right:1px solid var(--line); overflow-y:auto; padding:16px; }
  #right { overflow-y:auto; padding:16px 22px; }
  textarea { width:100%; min-height:64px; background:var(--panel); color:var(--text);
             border:1px solid var(--line); border-radius:6px; padding:8px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:6px 14px; cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.deny { background:var(--bad); }
  .row { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .session { padding:10px 12px; margin-top:8px; background:var(--panel); border:1px solid var(--line);
             border-radius:8px; cursor:pointer; }
  .session:hover, .session.active { border-color:var(--accent); }
  .session .text { font-size:13px; }
  .session .meta { color:var(--dim); font-size:11px; margin-top:3px; display:flex; gap:8px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:9px; font-size:11px; }
  .pill.done { background:#1d3a2c; color:var(--ok); }
  .pill.failed, .pill.cancelled { background:#3a1d1d; color:var(--bad); }
  .pill.awaiting_approval, .pill.awaiting_input { background:#3a311d; color:var(--warn); }
  .pill.deliberating, .pill.composing, .pill.received, .pill.classified
       { background:#1d2a3a; color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; margin-bottom:12px; }
  .card h3 { margin:0 0 8px; font-size:13px; color:var(--dim); text-transform:uppercase;
             letter-spacing:.5px; }
  .needs { border-color:var(--warn); }
  pre, .mono { white-space:pre-wrap; word-break:break-word; font-family:Consolas, monospace;
               font-size:12.5px; }
  details { margin-top:6px; }
  summary { cursor:pointer; color:var(--dim); font-size:12.5px; }
  .conf-high { color:var(--ok); } .conf-medium { color:var(--warn); } .conf-low { color:var(--bad); }
  ul { margin:4px 0; padding-left:20px; }
  .empty { color:var(--dim); padding:30px; text-align:center; }
  .live { display:flex; align-items:center; gap:10px; border-color:var(--accent);
          background:#15202e; }
  .live .dot { width:10px; height:10px; border-radius:50%; background:var(--accent);
               animation:pulse 1.1s ease-in-out infinite; flex:none; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); }
                     50% { opacity:.35; transform:scale(.7); } }
  .live .what { font-weight:600; text-transform:capitalize; }
  .live .meta { color:var(--dim); font-size:12px; }
  .contrib { border:1px solid var(--line); border-radius:6px; margin-top:8px; }
  .contrib > .hd { display:flex; gap:8px; align-items:center; padding:6px 10px;
                   background:#141a24; border-bottom:1px solid var(--line); font-size:12px; }
  .contrib > .hd .who { color:var(--accent); font-weight:600; }
  .contrib > .hd .rnd { color:var(--dim); }
  .contrib > .hd .len { color:var(--dim); margin-left:auto; }
  .contrib pre { margin:0; padding:10px; max-height:340px; overflow:auto; }
  .roster { display:flex; flex-wrap:wrap; gap:6px; }
  .seat { font-size:11px; padding:2px 9px; border-radius:9px; border:1px solid var(--line);
          color:var(--dim); }
  .seat.on { border-color:var(--accent); color:var(--accent); }
  .seat.spoke { border-color:var(--ok); color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>Conclave OS</h1>
  <span class="sub" id="backend">backend: …</span>
  <span class="sub">human authority preserved — nothing executes without your approval</span>
</header>
<main>
  <div id="left">
    <textarea id="task" placeholder="Describe a task for the council…"></textarea>
    <div class="row">
      <button onclick="submitTask()">Submit task</button>
      <span class="sub" id="submitNote"></span>
    </div>
    <div id="sessions"></div>
  </div>
  <div id="right"><div class="empty">Select a session</div></div>
</main>
<script>
let current = null;

const esc = s => (s ?? "").toString()
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const api = (path, opts) => fetch(path, opts).then(r => r.json());

async function loadHealth() {
  const h = await api("/health");
  document.getElementById("backend").textContent = "backend: " + h.backend;
}

async function submitTask() {
  const box = document.getElementById("task");
  if (!box.value.trim()) return;
  const r = await api("/tasks", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text: box.value, source:"dashboard", background:true})});
  box.value = "";
  document.getElementById("submitNote").textContent = "submitted " + r.session_id;
  current = r.session_id;
  await refresh();
}

async function refresh() {
  const sessions = await api("/sessions");
  const el = document.getElementById("sessions");
  el.innerHTML = sessions.map(s => `
    <div class="session ${s.session_id===current?"active":""}" onclick="select('${s.session_id}')">
      <div class="text">${esc(s.task_text) || "(no text)"}</div>
      <div class="meta">
        <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
        ${s.pending_approvals ? `<span class="pill awaiting_approval">${s.pending_approvals} approval</span>` : ""}
        ${s.pending_inputs ? `<span class="pill awaiting_input">${s.pending_inputs} question</span>` : ""}
        <span>${esc(s.session_id)}</span>
      </div>
    </div>`).join("");
  if (current) renderDetail(await fetch("/sessions/" + current).then(r => r.ok ? r.json() : null));
}

function select(id) { current = id; refresh(); }

function renderDetail(s) {
  if (!s) return;
  const right = document.getElementById("right");
  const final = s.final;
  const approvals = (s.approvals||[]).filter(a => a.status === "pending");
  const inputs = (s.input_requests||[]).filter(i => i.status === "pending");

  // The poll timer re-renders this pane every few seconds; snapshot any
  // in-progress answer text + focus/caret + scroll so reading/typing isn't
  // clobbered mid-word.
  const draft = {};
  right.querySelectorAll('textarea[id^="ans_"]').forEach(t => {
    draft[t.id] = {v: t.value, start: t.selectionStart, end: t.selectionEnd,
                   focused: document.activeElement === t};
  });
  const scrollTop = right.scrollTop;

  const working = ["received","classified","deliberating","composing"].includes(s.status);
  const spokenRoles = new Set((s.contributions||[]).map(c => c.role));
  const roster = ((s.council||{}).members||[])
    .filter(m => m.active && m.agent && m.agent !== "system");

  right.innerHTML = `
    <div class="card">
      <h3>Task — <span class="pill ${esc(s.status)}">${esc(s.status)}</span>
          ${s.stop_reason ? `<span class="sub"> · ${esc(s.stop_reason)}</span>` : ""}</h3>
      <div class="mono">${esc(s.task?.text)}</div>
    </div>

    ${working ? `
      <div class="card live">
        <span class="dot"></span>
        <div>
          <div class="what">${esc(s.status)}…</div>
          <div class="meta">round ${s.current_round ?? 0} · ${s.agent_calls||0} agent call${(s.agent_calls===1)?"":"s"} so far · updates live</div>
        </div>
      </div>` : ""}

    ${roster.length ? `
      <div class="card">
        <h3>Council</h3>
        <div class="roster">
          ${roster.map(m => `<span class="seat ${spokenRoles.has(m.role)?"spoke":"on"}">${esc(m.role)} · ${esc(m.agent)}${spokenRoles.has(m.role)?" ✓":""}</span>`).join("")}
        </div>
      </div>` : ""}

    ${approvals.map(a => `
      <div class="card needs">
        <h3>Approval needed — ${esc(a.category)} / ${esc(a.risk)}</h3>
        <div>${esc(a.action)}</div>
        <div class="row">
          <button onclick="resolveApproval('${a.approval_id}', true)">Approve</button>
          <button class="deny" onclick="resolveApproval('${a.approval_id}', false)">Deny</button>
        </div>
      </div>`).join("")}

    ${inputs.map(i => `
      <div class="card needs">
        <h3>Agent question — ${esc(i.role)}@${esc(i.agent)}</h3>
        <div>${esc(i.question)}</div>
        <textarea id="ans_${i.input_id}" placeholder="Your answer…"></textarea>
        <div class="row">
          <button onclick="answerInput('${i.input_id}')">Answer</button>
          <button class="deny" onclick="declineInput('${i.input_id}')">Decline</button>
        </div>
      </div>`).join("")}

    ${final ? `
      <div class="card">
        <h3>Final answer — <span class="conf-${esc(final.confidence)}">${esc(final.confidence)} confidence</span></h3>
        <pre>${esc(final.answer)}</pre>
        ${final.assumptions?.length ? `<h3>Assumptions</h3><ul>${final.assumptions.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${final.risks_unresolved?.length ? `<h3>Risks / unresolved</h3><ul>${final.risks_unresolved.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${final.next_action ? `<h3>Next action</h3><div>${esc(final.next_action)}</div>` : ""}
      </div>` : ""}

    ${(s.files_changed||[]).length ? `
      <div class="card"><h3>Files written</h3>
        <ul>${s.files_changed.map(f=>`<li class="mono">${esc(f)}</li>`).join("")}</ul></div>` : ""}

    ${(s.disagreements||[]).length ? `
      <div class="card"><h3>Disagreements (${s.disagreements.length})</h3>
        ${s.disagreements.map(d => `
          <div class="contrib">
            <div class="hd"><span class="who">${esc(d.topic)}</span>
              <span class="len">ruled on ${esc(d.ruling_basis)}</span></div>
            <div style="padding:10px">
              <ul>${(d.positions||[]).map(p=>`<li><b>${esc(p.role)}:</b> ${esc(p.claim)}</li>`).join("")}</ul>
              ${d.critic_test ? `<div class="mono">${esc(d.critic_test)}</div>` : ""}
            </div>
          </div>`).join("")}</div>` : ""}

    ${(s.contributions||[]).length ? `
      <div class="card"><h3>Contributions (${s.contributions.length}, ${s.agent_calls} agent calls)</h3>
        ${s.contributions.map(c => `
          <div class="contrib">
            <div class="hd"><span class="rnd">r${c.round}</span>
              <span class="who">${esc(c.role)} · ${esc(c.agent)}</span>
              <span class="len">${(c.content||"").length} chars</span></div>
            <pre>${esc(c.content)}</pre>
          </div>`).join("")}</div>` : ""}
  `;

  // Restore answer-in-progress + scroll position that survived this re-render.
  for (const [id, d] of Object.entries(draft)) {
    const t = document.getElementById(id);
    if (!t) continue;
    t.value = d.v;
    if (d.focused) { t.focus(); try { t.setSelectionRange(d.start, d.end); } catch {} }
  }
  right.scrollTop = scrollTop;
}

async function resolveApproval(aid, approved) {
  await api(`/sessions/${current}/approvals/${aid}`, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({approved, background:true})});
  refresh();
}

async function answerInput(iid) {
  const text = document.getElementById("ans_" + iid).value;
  if (!text.trim()) return;
  await api(`/sessions/${current}/inputs/${iid}`, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({answer: text, background:true})});
  refresh();
}

async function declineInput(iid) {
  await api(`/sessions/${current}/inputs/${iid}`, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({decline:true})});
  refresh();
}

loadHealth();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
