[project]
name = "conclave-os"
version = "0.1.0"
description = "Conclave OS Type 1 — Coordinator OS: a bounded, human-governed multi-agent coordination layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
