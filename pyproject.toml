[project]
name = "gangof8"
version = "0.1.0"
description = "Gang of 8 Type 1 — Coordinator OS: a bounded, human-governed multi-agent coordination layer"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",          # OpenRouter adapter (runtime HTTP client)
    "google-genai>=1.0",    # gemini SDK: vision/text calls + Google Search grounding (web_search)
    "pypdf>=4",             # PDF attachment text extraction (uploads)
    "playwright>=1.50",     # fail-closed real-browser acceptance for interactive HTML
]

[project.scripts]
gangof8 = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gangof8", "gangof8.adapters"]
py-modules = ["cli"]

[tool.setuptools.package-data]
gangof8 = ["static/*", "default-settings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp_run"
cache_dir = ".pytest_tmp_run/.pytest_cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Start with correctness diagnostics. Formatting and broader style enforcement
# can be introduced incrementally after the existing large modules are split.
select = ["F"]
