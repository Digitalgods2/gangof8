<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gang of 8</title>
<link rel="icon" type="image/png" href="/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true">
  <div class="grid-lines"></div>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
</div>
<header>
  <span class="brand"><img src="/gangof8-text.png" class="brand-lockup" alt="Gang of 8"></span>
  <span class="bpill"><span class="dot"></span><span id="backend">backend: …</span></span>
  <span class="bpill"><span class="dot dot-brand"></span><span id="workspace">workspace: …</span></span>
  <span class="bpill tagline">🔒 nothing executes without your approval</span>
  <div id="aiSeatToggles" class="ai-seat-toggles" role="group"
       aria-label="Enabled AI brands" aria-busy="true">
    <label><input type="checkbox" data-settings-map="cli_enabled" data-seat="codex" disabled>OpenAI</label>
    <label><input type="checkbox" data-settings-map="cli_enabled" data-seat="claude" disabled>Anthropic</label>
    <label><input type="checkbox" data-settings-map="cli_enabled" data-seat="gemini" disabled>Gemini</label>
    <label><input type="checkbox" data-settings-map="openrouter_enabled" data-seat="deepseek" disabled>DeepSeek</label>
    <label><input type="checkbox" data-settings-map="openrouter_enabled" data-seat="glm" disabled>GLM</label>
    <label><input type="checkbox" data-settings-map="openrouter_enabled" data-seat="qwen" disabled>Qwen</label>
    <label><input type="checkbox" data-settings-map="openrouter_enabled" data-seat="kimi" disabled>Kimi</label>
    <span id="aiSeatToggleStatus" class="ai-seat-toggle-status" role="status" aria-live="polite"></span>
  </div>
  <div class="hgroup">
    <button class="hbtn" title="Hard refresh — reload the page, bypassing cache (like Ctrl/Cmd+F5)" onclick="hardRefresh()">⟳</button>
    <button class="hbtn" title="Save this session (task, summary, risks, files, contributions, timeline) as a Markdown file" onclick="savePage()">💾</button>
    <button class="hbtn" title="Settings" onclick="openSettings()">⚙</button>
    <button class="hbtn" title="Diagnostics" onclick="window.open('/diagnostics','_blank')">Diag</button>
  </div>
</header>

<div id="settingsOverlay" onclick="if(event.target===this)closeSettings()">
  <div id="settingsPanel">
    <div class="shead">
      <h2>Settings</h2>
      <button class="ghost x" onclick="closeSettings()">Close</button>
    </div>
    <div id="settingsBody"><div class="empty">Loading…</div></div>
    <div class="row">
      <button onclick="saveSettings()">Save settings</button>
      <button class="ghost" onclick="applyOpenRouterOnly()"
              title="Enable all OpenRouter models, turn off the local CLI seats, and save — the council then runs entirely on OpenRouter.">OpenRouter-only</button>
      <button class="ghost" onclick="applyLocalCliOnly()"
              title="Turn the local CLI seats back on and disable all OpenRouter models, then save — the council runs entirely on the local CLIs.">Local-CLIs-only</button>
      <span id="savedNote"></span>
    </div>
  </div>
</div>

<div id="fsOverlay" onclick="if(event.target===this)closeFs()">
  <div id="fsPanel">
    <div class="shead"><h2>Choose a folder</h2>
      <button class="ghost x" onclick="closeFs()">Cancel</button></div>
    <div id="fsTools">
      <input id="fsInput" placeholder="type or paste a path, then Enter"
             onkeydown="if(event.key==='Enter')fsNavigate(this.value)">
      <button class="ghost" onclick="fsNavigate(document.getElementById('fsInput').value)">Go</button>
      <button class="ghost" onclick="fsNewFolder()">＋ New folder</button>
    </div>
    <div id="fsCrumbs"></div>
    <div id="fsBody">
      <div id="fsNav"></div>
      <div id="fsList"></div>
    </div>
    <div class="fsfoot">
      <span class="sel" id="fsSel">Select a folder</span>
      <button onclick="useFsFolder()">Use this folder</button>
    </div>
  </div>
</div>

<main>
  <div id="left">
    <div id="goalsWrap" style="display:none">
      <h2>Goals</h2>
      <div id="goals"></div>
    </div>
    <h2>Sessions</h2>
    <div id="sessions"></div>
  </div>
  <div id="right"><div class="empty">Select a session</div></div>
</main>

<div id="composer">
  <div class="term-bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span>
    <span class="path">council composer — one question, every AI you have</span></div>
  <div class="cbody">
  <div id="attachments"></div>
  <div class="crow">
    <div class="plusw">
      <button id="plusBtn" title="Attach a file" onclick="togglePlus(event)">+</button>
      <div id="plusMenu" class="plus-menu">
        <button onclick="pickFile('doc')">📄 Attach document (text / PDF)</button>
        <button onclick="pickFile('image')">🖼️ Attach image</button>
      </div>
    </div>
    <textarea id="task" rows="1" placeholder="Describe a task for the council…  (Enter to send, Shift+Enter for a new line, /goal for a long build)"
              oninput="autoGrow(this)" onkeydown="composerKey(event)"></textarea>
    <button class="ghost" onclick="clearComposer()">Clear</button>
    <button id="enhanceBtn" type="button" class="ghost"
            title="Rewrite your prompt into a sharper, more effective version using your strong codifier model (the Summarizer seat). Click again to Undo.">✨ Enhance</button>
    <button id="cancelBtn" class="deny" style="display:none" onclick="cancelCurrent()">Cancel run</button>
    <button onclick="submitTask()">Send</button>
  </div>
  <input type="file" id="fileInput" style="display:none" onchange="onFilePicked(event)">
  <div class="sub" id="submitNote" style="margin-top:6px"></div>
  </div>
</div>
<script src="/dashboard-utils.js"></script>
<script src="/app.js"></script>
</body>
</html>
